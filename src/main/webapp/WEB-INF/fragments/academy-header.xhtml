<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui">
        <header class="llavor-topbar academy-header llavor-platform-header" id="academy-header">
            <button id="academy-menu-toggle" class="academy-icon-button academy-menu-toggle" type="button" aria-controls="academy-sidebar" aria-expanded="false" aria-label="#{academyLanguageBean.text['academy.shell.open_menu']}"><i class="pi pi-bars" aria-hidden="true"></i></button>
            <h:link outcome="/index.xhtml" styleClass="llavor-brand-link">
                <h:graphicImage library="llavor" name="images/llavor-header-white.jpg"
                                alt="Llavor Academy" styleClass="llavor-header-logo"
                                width="204" height="68"
/>
            </h:link>
            <details id="platform-controls" class="platform-controls">
                <summary class="platform-controls-toggle" aria-label="#{academyLanguageBean.text['common.language.select']} / #{academyLanguageBean.text['common.session.logout']}"><i class="pi pi-sliders-h" aria-hidden="true"></i></summary>
            <div class="llavor-topbar-right" id="academy-header-actions">
                <div class="llavor-user-identity">
                    <h:outputText value="#{academyHome.displayName}" styleClass="llavor-user-name"/>
                </div>
                <div id="academy-header-session" class="academy-header-session"></div>
            </div>
            </details>
        </header>
</ui:composition>
